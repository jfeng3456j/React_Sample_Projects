name: Build and Deploy

on:
  workflow_run:
    workflows: ["Run Tests"]
    branches: [main, master]
    types:
      - completed

env:
  REACT_APP_GA_TRACKING_ID: ${{ secrets.REACT_APP_GA_TRACKING_ID }}

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "pnpm"
          cache-dependency-path: react_counter_app/pnpm-lock.yaml

      - name: Echo GA ID (masked)
        run: |
          echo "Google Analytics ID: ${REACT_APP_GA_TRACKING_ID:0:3}...${REACT_APP_GA_TRACKING_ID: -3}"
          echo "Total characters: ${#REACT_APP_GA_TRACKING_ID}"

      - name: Install dependencies
        run: pnpm install
        working-directory: ./react_counter_app

      - name: Build
        env:
          REACT_APP_GA_TRACKING_ID: ${{ secrets.REACT_APP_GA_TRACKING_ID }}
        run: pnpm run build
        working-directory: ./react_counter_app

      - name: Check build output
        run: |
          echo "Checking if build was successful..."
          if [ -d "./react_counter_app/build" ]; then
            echo "✅ Build directory created"
            ls -la ./react_counter_app/build/
          else
            echo "❌ Build directory NOT created!"
            exit 1
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./react_counter_app/build
          force_orphan: true
