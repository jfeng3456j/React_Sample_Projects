name: Run Tests

on:
  push:
    branches: [main, master]
    paths:
      - "react_counter_app/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main, master]
    paths:
      - "react_counter_app/**"
      - ".github/workflows/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "pnpm"
          cache-dependency-path: react_counter_app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: ./react_counter_app

      - name: Run tests
        # This will exit with non-zero code if tests fail
        run: pnpm test -- --watchAll=false --coverage
        working-directory: ./react_counter_app

      - name: Upload coverage reports to Codecov
        if: success() # Only upload if tests pass
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./react_counter_app/coverage/lcov.info
          fail_ci_if_error: false # Don't fail build if Codecov upload fails

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: react_counter_app/coverage/
          retention-days: 1
