name: Build and Deploy

on:
  workflow_run:
    workflows: ["Run Tests"]
    branches: [main, master]
    types:
      - completed

env:
  REACT_APP_GA_TRACKING_ID: ${{secrets.REACT_APP_GA_TRACKING_ID}}

jobs:
  deploy:
    if: ${{github.event.workflow_run.conclusion == 'success'}}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Echo GA ID (masked)
        run: |
          echo "Google Analytics ID: ${REACT_APP_GA_TRACKING_ID:0:3}...${REACT_APP_GA_TRACKING_ID: -3}"
          echo "Total characters: ${#REACT_APP_GA_TRACKING_ID}"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to github
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          publish_dir: ./build
